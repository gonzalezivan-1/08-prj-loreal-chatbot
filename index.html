<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Beauty &amp; Product Advisor</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!-- Header / L'Oréal Branding -->
      <header class="site-header">
        <img
          src="img/loreal-logo.png"
          alt="L'Oréal Paris Logo"
          class="brand-logo"
        />
        <p class="brand-tagline">Because You're Worth It</p>
        <h1 class="site-title">Smart Product &amp; Routine Advisor</h1>
      </header>

      <!-- Chat Area -->
      <main>
        <section class="chatbox" aria-label="L'Oréal Beauty Advisor Chat">
          <!-- LevelUp: Displays the user's latest question right above the chat response -->
          <div id="latestQuestionBar" class="latest-question-bar" hidden>
            <span class="latest-question-label">Current Question:</span>
            <span id="latestQuestionText" class="latest-question-text"></span>
          </div>

          <div
            id="chatWindow"
            class="chat-window"
            role="log"
            aria-live="polite"
          >
            <!-- Conversation bubbles are appended here via script.js -->
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about L'Oréal skincare, makeup, haircare, or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn" aria-label="Send message">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!-- Footer Links -->
      <footer class="site-footer">
        <p>&copy; 2026 L'Oréal. All rights reserved.</p>
        <nav aria-label="Footer navigation">
          <a href="#privacy">Privacy Policy</a>
          <a href="#terms">Terms of Use</a>
          <a href="#contact">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
